<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <title>Galeria | SOFTBYKE</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            list-style: none;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #03071e;
            color: #fff;
            min-height: 100vh;
        }

        /* Header Padronizado */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 25px 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            background: rgba(3, 7, 30, 0.9);
            backdrop-filter: blur(10px);
        }

        header .logo img {
            height: 45px;
            width: auto;
            object-fit: contain;
        }

        header nav ul {
            display: flex;
            gap: 40px;
        }

        header nav ul li a {
            color: #fff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: 0.3s;
        }

        header nav ul li a:hover,
        header nav ul li a.active {
            color: #beff11;
        }

        .page-container {
            padding: 140px 20px 60px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-title {
            font-family: 'League Gothic', sans-serif;
            font-size: 4rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .page-subtitle {
            color: #a8b2d1;
            font-size: 1.1rem;
        }

        /* Estrutura da grade em 3 colunas */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        /* Card dos Produtos */
        .product-card {
            background: rgba(13, 27, 42, 0.75);
            border: 1px solid rgba(0, 212, 255, 0.25);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .product-card:hover {
            transform: translateY(-6px);
            border-color: rgba(0, 212, 255, 0.7);
            box-shadow: 0 10px 25px rgba(0, 212, 255, 0.15);
        }

        .card-img-wrapper {
            background: rgba(255, 255, 255, 0.03);
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card-img-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .card-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .product-desc {
            font-size: 0.85rem;
            color: #a8b2d1;
            line-height: 1.4;
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .product-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .product-price {
            font-size: 1.25rem;
            font-weight: 700;
            color: #beff11;
        }

        @media (max-width: 900px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .gallery-grid {
                grid-template-columns: 1fr;
            }
            header {
                padding: 20px 40px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="header-left">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <div class="logo"><img src="img/logo.png" alt="SOFTBYKE Logo"></div>
        </div>

        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="bicicletas.html">Bicicletas</a></li>
                <li><a href="empresa.html">Empresa</a></li>
                <li><a href="produtos.html">Produtos</a></li>
                <li><a href="galeria.html" class="active">Galeria</a></li>
                <li><a href="documentos.html">Documentos</a></li>
            </ul>
        </nav>

        <div class="search-box">
            <input type="text" placeholder="Procurar produto especifico...">
        </div>
    </header>

    <div class="side-drawer" id="sideDrawer">
        <button class="drawer-close" id="drawerClose">✕</button>
        <ul>
            <li><a href="index.html">INÍCIO</a></li>
            <li><a href="bicicletas.html">BICICLETAS</a></li>
            <li><a href="empresa.html">EMPRESA</a></li>
            <li><a href="produtos.html">PRODUTOS</a></li>
            <li><a href="galeria.html">GALERIA</a></li>
            <li><a href="documentos.html">DOCUMENTOS</a></li>
        </ul>
    </div>
    <div class="drawer-overlay" id="drawerOverlay"></div>

    <main class="page-container">
        <h1 class="page-title">GALERIA</h1>
        <p class="page-subtitle">Espaço reservado para ensaios visuais e eventos SOFTBYKE</p>

        <div class="empty-gallery-box">
            <h2>Galeria em atualização</h2>
            <p>Novos conteúdos visuais serão adicionados em breve.</p>
        </div>
    </main>

    <script src="scripts.js"></script>
</body>
</html>
